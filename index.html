<!doctype html>
<html lang="en">
  <head>
    <!-- Analytics is Vercel Web Analytics, mounted in src/main.tsx rather than loaded here.
         Google Analytics (gtag.js, G-Z61ENG55YD) used to sit at this spot behind a
         requestIdleCallback deferral, and was removed on 2026-08-26: it transferred 147.5 KiB,
         more than React and this app's entire shell combined, to record pageviews and nothing
         else. A search of the codebase found zero custom gtag() calls -- no conversion tracking,
         no funnel events -- so the whole 147.5 KiB bought automatic pageviews and GA4's enhanced
         measurement. The replacement is roughly 1 KiB for the same pageview data.
         Historical GA4 data remains in the Google Analytics property; it is simply no longer
         collecting. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect to both Google Fonts origins before the stylesheet request even fires -- the
         connection handshake (DNS + TCP + TLS) to a fresh third-party origin is most of what made
         this render-blocking request take 750ms despite the CSS itself being under 2KB. Two
         origins because the CSS below only names fonts.googleapis.com; the actual .woff2 files it
         references live on fonts.gstatic.com, a second connection the browser wouldn't otherwise
         start warming until it had already parsed this response. crossorigin is required on the
         gstatic one specifically -- font fetches are always CORS requests regardless of this tag,
         and a preconnect missing crossorigin opens a connection the font fetch can't reuse,
         wasting the handshake it was meant to save. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Previously a CSS @import inside src/index.css -- moved here so the preload scanner finds
         it during the initial HTML parse instead of after fetching and starting to parse that
         file first. Playfair Display dropped from the request (see src/index.css for why).

         media="print" + onload="this.media='all'" is what stops this from blocking first paint.
         A stylesheet whose media query doesn't match the current device is still downloaded, just
         at low priority and WITHOUT holding up render; flipping media to "all" once it has
         arrived then applies it normally. PageSpeed measured this single request as 750ms of
         render-blocking time (1,390ms across both blocking requests) -- almost entirely the
         third-party connection setup, which the preconnects above can only partly hide.

         This does not introduce a font flash that wasn't already there: the URL already ends in
         &display=swap, which by definition renders fallback text first and swaps when the webfont
         arrives. All this changes is that the *rest of the page* no longer waits on the font CSS
         to start painting. The <noscript> copy keeps fonts working where the onload never fires. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" />
    </noscript>
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Before Regret — Free US Property Research</title>
    <meta name="description" content="Before Regret is free property research for US home buyers: the questions to ask the seller and what to inspect first, for any US home." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.beforeregret.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.beforeregret.com/" />
    <meta property="og:title" content="Before Regret — Free US Property Research" />
    <meta property="og:description" content="Before Regret is free property research for US home buyers: the questions to ask the seller and what to inspect first, for any US home." />
    <meta property="og:image" content="https://www.beforeregret.com/og-image.png" />
    <meta property="og:site_name" content="Before Regret" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Before Regret — Free US Property Research" />
    <meta name="twitter:description" content="Before Regret is free property research for US home buyers: the questions to ask the seller and what to inspect first, for any US home." />
    <meta name="twitter:image" content="https://www.beforeregret.com/og-image.png" />

    <!-- Structured Data (Organization & WebSite SearchAction) -->
    <!-- The site's entity definition: who BeforeRegret IS, as opposed to what any single page is
         about. Lives here, in the shared template, so it is present in the RAW HTML of every page
         on the domain without JavaScript -- which matters because a large share of AI crawlers
         issue a plain fetch and never execute JS, and an entity definition they cannot see does
         not do its job.

         This block deliberately carries NO data-seo attribute. src/utils/headSeo.ts strips
         [data-seo="dynamic"] and [data-seo="prerendered"] blocks on every route change so
         page-specific schema never duplicates; leaving this one unmarked is what keeps the global
         entity in place across all of that. Do not add the attribute.

         Every field below is verifiable. sameAs carries the official LinkedIn company page, in its
         vanity-slug form (LinkedIn's own canonical, and more durable than the numeric-ID URL the
         same page also answers on), and the Facebook page.

         FACEBOOK, added 2026-09-20. It was already ranking on the brand SERP unclaimed, so Google
         was guessing at the relationship rather than being told. Checked in a real browser before
         adding -- curl gets HTTP 400 from Facebook regardless of whether a page exists, so a
         command-line check proves nothing here. The page is live, named "Before Regret",
         categorised "Property service", and its Website field points at beforeregret.com.

         Know what this profile is and is not: it is an older page the owner renamed, so the ~2.7K
         followers came with the previous identity and are not a property-research audience. That is
         fine for what sameAs is for -- corroborating that the entity exists and is who it says --
         and it is why the page should not be judged on engagement. It is an identity signal, not a
         distribution channel.

         INSTAGRAM, added the same day, @beforeregret.official, ~10.7K followers, linked to the
         Facebook page through Meta. Also verified in a browser rather than by curl. Its display
         name is exactly "Before Regret", matching the name field below, and its website field
         points here -- both halves of the two-way confirmation are in place.

         It had no posts when it was claimed. That does not weaken the entity signal, which is what
         this property is for, but anyone arriving from a brand search lands on an empty grid above
         a five-figure follower count, and that reads as bought or abandoned. The fix is content on
         the profile, not removal from this list.

         This comment used to say the link could NOT be checked from here, on the grounds that
         LinkedIn answers automated clients with HTTP 999. Re-tested 2026-09-15 with a Googlebot
         UA: it returned 200 and 212KB, and the served HTML names "Before Regret" 61 times and
         beforeregret.com 6 times. So the corroboration link is live and fetchable, and the
         property is doing the job it exists for. Do not remove it on the old assumption.

         For that confirmation to run in BOTH directions, the LinkedIn page's own Website field
         must point back at https://www.beforeregret.com. Without the return link this is a one-way
         claim and does far less work. A sameAs pointing somewhere dead is worse than none at all,
         because the property exists specifically so a search engine can CONFIRM identity against
         another source -- so re-check by hand if the page is ever renamed or removed.

         Still deliberately omitted rather than guessed: foundingDate, employee count and any
         rating, none of which are stated anywhere on this site. Same rule the content itself
         follows -- if it isn't backed by something real, it doesn't get asserted.

         The postal address sits on parentOrganization because that is exactly what the Privacy
         Policy says -- Atmostellar is the registered entity, in Mumbai; Before Regret is its
         product brand.

         BRAND NAME: "Before Regret", two words. This was briefly swapped to the one-word form on
         2026-08-27 on the argument that "BeforeRegret" is a more distinctive token and easier to
         rank -- searching "before regret", or even the exact domain, returns pages about deathbed
         regrets and not this site. That reasoning was reverted the same day, on the owner's call,
         and the argument was overstated: Apple, Amazon, Target and Gap are all ordinary words that
         rank first for themselves. A common-word brand is slower to establish, not permanently
         blocked. What Google is missing is an entity record for a young domain, which no choice of
         string fixes -- only mentions and links do.

         alternateName carries the one-word form, so a search for either still resolves here.
         Keep "Before Regret" as name. Do not swap these again. -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.beforeregret.com/#organization",
        "name": "Before Regret",
        "alternateName": "BeforeRegret",
        "url": "https://www.beforeregret.com",
        "logo": "https://www.beforeregret.com/favicon.svg",
        "description": "Free, address-based property research for US home buyers and renters. Runs a live USGS seismic hazard check and validates the address against US Census records, then gives a curated, source-linked checklist of what to verify -- with anything not independently verified labeled as such rather than guessed.",
        "sameAs": [
          "https://www.linkedin.com/company/before-regret/",
          "https://www.facebook.com/BeforeRegret",
          "https://www.instagram.com/beforeregret.official/"
        ],
        "knowsAbout": [
          "Home inspection reports",
          "Building permit and code violation records",
          "Residential electrical and plumbing defects",
          "Natural hazard risk (FEMA National Risk Index, EPA radon, NOAA storm history)",
          "Homeowners insurance underwriting requirements",
          "US county housing stock and property records"
        ],
        "areaServed": {
          "@type": "Country",
          "name": "United States"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "hello@beforeregret.com",
          "availableLanguage": "English"
        },
        "parentOrganization": {
          "@type": "Organization",
          "name": "Atmostellar",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Mumbai",
            "addressRegion": "Maharashtra",
            "addressCountry": "IN"
          }
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.beforeregret.com/#website",
        "name": "Before Regret",
        "alternateName": "BeforeRegret",
        "url": "https://www.beforeregret.com",
        "publisher": {
          "@id": "https://www.beforeregret.com/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.beforeregret.com/?address={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
