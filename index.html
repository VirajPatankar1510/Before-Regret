<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>BeforeRegret — Property Research from 20+ Public Records</title>
    <meta name="description" content="Free, address-based public record synthesis for US homebuyers and renters. Uncover FEMA flood zones, municipal permits, radon levels, noise, and broadband." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://beforeregret.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://beforeregret.com/" />
    <meta property="og:title" content="BeforeRegret — Property Research from 20+ Public Records" />
    <meta property="og:description" content="Free, address-based public record synthesis for US homebuyers and renters. Uncover FEMA flood zones, municipal permits, radon levels, noise, and broadband." />
    <meta property="og:image" content="https://beforeregret.com/og-image.png" />
    <meta property="og:site_name" content="BeforeRegret" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeforeRegret — Property Research from 20+ Public Records" />
    <meta name="twitter:description" content="Free, address-based public record synthesis for US homebuyers and renters. Uncover FEMA flood zones, municipal permits, radon levels, noise, and broadband." />
    <meta name="twitter:image" content="https://beforeregret.com/og-image.png" />

    <!-- Structured Data (Organization & WebSite SearchAction) -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Before Regret",
        "url": "https://beforeregret.com",
        "logo": "https://beforeregret.com/favicon.svg",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Atmostellar"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BeforeRegret",
        "url": "https://beforeregret.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://beforeregret.com/?address={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
    </script>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6283707600518454" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
