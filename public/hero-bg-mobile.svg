<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Sun High-Key Gradients -->
    <linearGradient id="skyGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FAFDFE"/>
      <stop offset="25%" stop-color="#F2F7FB"/>
      <stop offset="60%" stop-color="#E5F0FA"/>
      <stop offset="100%" stop-color="#D9E8F6"/>
    </linearGradient>

    <radialGradient id="sunBloom" cx="0.5" cy="0.32" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFFDF7" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#F2F8FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E0EEFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass & Facade Materials -->
    <linearGradient id="glassFacade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#E8F2FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CDE0F2" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="whiteConcrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBF1F7"/>
    </linearGradient>

    <linearGradient id="warmWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#A97142"/>
    </linearGradient>

    <!-- Water Reflection Pool -->
    <linearGradient id="waterPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B2D3EE" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8BBADC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6DA3CD" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Plaza Ground Tiles Gradient -->
    <linearGradient id="plazaPavement" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#EAF0F6"/>
      <stop offset="40%" stop-color="#DFE7F0"/>
      <stop offset="100%" stop-color="#D3DDE8"/>
    </linearGradient>

    <!-- Distance Haze Overlay -->
    <linearGradient id="hazeFilter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- 1. Sky & Sun Atmosphere -->
  <rect width="1080" height="1920" fill="url(#skyGrad)"/>
  <rect width="1080" height="1920" fill="url(#sunBloom)"/>

  <!-- Birds in the Sky -->
  <g stroke="#94A3B8" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M 220 840 Q 228 834 236 840 Q 244 834 252 840"/>
    <path d="M 260 820 Q 266 815 272 820 Q 278 815 284 820"/>
    <path d="M 180 860 Q 185 856 190 860 Q 195 856 200 860"/>
    <path d="M 310 850 Q 315 846 320 850 Q 325 846 330 850"/>
  </g>

  <!-- 2. Distant Skyscraper Cityscape (Hazy High-Rise Center Right) -->
  <g opacity="0.4">
    <!-- Tall Glass Tower with Angular Crown -->
    <polygon points="820,1350 820,820 855,730 890,820 890,1350" fill="#93C5FD"/>
    <rect x="825" y="820" width="60" height="530" fill="url(#glassFacade)"/>

    <!-- Midground Towers -->
    <rect x="710" y="1100" width="70" height="280" fill="#BBD7EE"/>
    <rect x="520" y="1180" width="55" height="200" fill="#CBDFF0"/>
    <rect x="420" y="1220" width="45" height="160" fill="#D3E5F4"/>
    <rect x="360" y="1160" width="50" height="220" fill="#C5DCF0"/>
    <rect x="290" y="1140" width="65" height="240" fill="#B9D5ED"/>
  </g>

  <!-- 3. Left Modern Apartment Building Complex -->
  <g id="left-building">
    <!-- Building Body Base -->
    <polygon points="-80,680 180,720 180,1580 -80,1580" fill="url(#whiteConcrete)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Balconies Layering -->
    <g fill="#FFFFFF" stroke="#B1C7DD" stroke-width="1.5">
      <!-- Story Floors & Balcony Projections -->
      <polygon points="-80,760 195,798 195,815 -80,777"/>
      <polygon points="-80,840 195,878 195,895 -80,857"/>
      <polygon points="-80,920 195,958 195,975 -80,937"/>
      <polygon points="-80,1000 195,1038 195,1055 -80,1017"/>
      <polygon points="-80,1080 195,1118 195,1135 -80,1097"/>
      <polygon points="-80,1160 195,1198 195,1215 -80,1177"/>
      <polygon points="-80,1240 195,1278 195,1295 -80,1257"/>
      <polygon points="-80,1320 195,1358 195,1375 -80,1337"/>
    </g>

    <!-- Glass Windows and Warm Lighting Effects -->
    <g fill="#93C5FD" opacity="0.45">
      <rect x="-40" y="725" width="45" height="30" transform="skewY(8)"/>
      <rect x="20" y="735" width="45" height="30" transform="skewY(8)"/>
      <rect x="80" y="745" width="45" height="30" transform="skewY(8)"/>

      <rect x="-40" y="805" width="45" height="30" transform="skewY(8)"/>
      <rect x="20" y="815" width="45" height="30" transform="skewY(8)"/>
      <rect x="80" y="825" width="45" height="30" transform="skewY(8)"/>

      <rect x="-40" y="885" width="45" height="30" transform="skewY(8)"/>
      <rect x="20" y="895" width="45" height="30" transform="skewY(8)"/>
      <rect x="80" y="905" width="45" height="30" transform="skewY(8)"/>
    </g>

    <!-- Secondary Mid-rise Wing behind left building -->
    <polygon points="120,1120 300,1150 300,1480 120,1480" fill="url(#whiteConcrete)" opacity="0.85"/>
  </g>

  <!-- 4. Right Modern Apartment Building Complex -->
  <g id="right-building">
    <!-- Right Main Structure -->
    <polygon points="900,600 1160,560 1160,1650 900,1650" fill="url(#whiteConcrete)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Right Balconies and Terrace Glass -->
    <g fill="#FFFFFF" stroke="#B1C7DD" stroke-width="1.5">
      <polygon points="885,680 1160,638 1160,655 885,697"/>
      <polygon points="885,760 1160,718 1160,735 885,777"/>
      <polygon points="885,840 1160,798 1160,815 885,857"/>
      <polygon points="885,920 1160,878 1160,895 885,937"/>
      <polygon points="885,1000 1160,958 1160,975 885,1017"/>
      <polygon points="885,1080 1160,1038 1160,1055 885,1097"/>
      <polygon points="885,1160 1160,1138 1160,1155 885,1177"/>
    </g>

    <!-- Ground Floor Cafe Umbrella / Terrace -->
    <path d="M 880 1380 L 980 1360 L 930 1340 Z" fill="#FFFFFF" stroke="#94A3B8"/>
    <rect x="925" y="1360" width="6" height="40" fill="#64748B"/>
  </g>

  <!-- 5. Central Pedestrian Plaza & Pavement -->
  <g id="plaza-ground">
    <!-- Main Plaza Perspective Floor -->
    <polygon points="-100,1920 1180,1920 620,1380 460,1380" fill="url(#plazaPavement)"/>

    <!-- Pavement Tile Perspective Grid Lines -->
    <g stroke="#CBD5E1" stroke-width="1" opacity="0.6">
      <line x1="540" y1="1380" x2="540" y2="1920"/>
      <line x1="500" y1="1380" x2="200" y2="1920"/>
      <line x1="470" y1="1380" x2="-20" y2="1920"/>
      <line x1="580" y1="1380" x2="880" y2="1920"/>
      <line x1="610" y1="1380" x2="1100" y2="1920"/>

      <!-- Horizontal Tile Grid Lines -->
      <line x1="-10" y1="1840" x2="1090" y2="1840"/>
      <line x1="80" y1="1740" x2="1000" y2="1740"/>
      <line x1="180" y1="1640" x2="900" y2="1640"/>
      <line x1="280" y1="1540" x2="800" y2="1540"/>
      <line x1="380" y1="1440" x2="700" y2="1440"/>
    </g>
  </g>

  <!-- 6. Reflecting Pool on the Right -->
  <g id="reflecting-pool">
    <polygon points="680,1520 1080,1660 1080,1880 660,1620" fill="url(#waterPool)"/>
    <!-- Pool Rim Margin -->
    <polygon points="675,1515 1080,1655 1080,1665 675,1525" fill="#E2E8F0" stroke="#CBD5E1"/>

    <!-- Subtle Water Ripples -->
    <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.5">
      <line x1="720" y1="1560" x2="850" y2="1600"/>
      <line x1="780" y1="1620" x2="950" y2="1680"/>
      <line x1="710" y1="1600" x2="820" y2="1640"/>
    </g>
  </g>

  <!-- 7. Fountain Water Jet Sprays in Distance -->
  <g opacity="0.75">
    <path d="M 550 1410 Q 540 1370 530 1410" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 570 1410 Q 560 1360 550 1410" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 590 1410 Q 580 1375 570 1410" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- 8. Lush Green Boulevard Trees & Benches -->
  <g id="trees-left">
    <!-- Tree 1 Left Far -->
    <circle cx="260" cy="1420" r="42" fill="#15803D"/>
    <circle cx="260" cy="1405" r="32" fill="#22C55E"/>
    <rect x="256" y="1445" width="8" height="35" fill="#78350F"/>

    <!-- Tree 2 Left Near -->
    <circle cx="200" cy="1490" r="54" fill="#15803D"/>
    <circle cx="200" cy="1470" r="42" fill="#22C55E"/>
    <circle cx="220" cy="1460" r="28" fill="#4ADE80"/>
    <rect x="195" y="1520" width="10" height="45" fill="#78350F"/>

    <!-- Tree 3 Left Front -->
    <circle cx="110" cy="1580" r="70" fill="#15803D"/>
    <circle cx="110" cy="1550" r="56" fill="#22C55E"/>
    <circle cx="135" cy="1535" r="38" fill="#4ADE80"/>
    <rect x="104" y="1620" width="12" height="60" fill="#78350F"/>
  </g>

  <g id="trees-right">
    <!-- Tree 1 Right Far -->
    <circle cx="760" cy="1430" r="45" fill="#15803D"/>
    <circle cx="760" cy="1415" r="35" fill="#22C55E"/>
    <rect x="756" y="1455" width="8" height="35" fill="#78350F"/>

    <!-- Tree 2 Right Near -->
    <circle cx="850" cy="1480" r="58" fill="#15803D"/>
    <circle cx="850" cy="1460" r="46" fill="#22C55E"/>
    <circle cx="830" cy="1450" r="30" fill="#4ADE80"/>
    <rect x="845" y="1515" width="10" height="45" fill="#78350F"/>
  </g>

  <!-- 9. People / Cyclist Silhouette Figures -->
  <g id="plaza-figures" opacity="0.75">
    <!-- Cyclist in Center Plaza -->
    <circle cx="390" cy="1510" r="6" fill="#334155"/>
    <line x1="390" y1="1516" x2="390" y2="1532" stroke="#334155" stroke-width="2.5"/>
    <circle cx="380" cy="1540" r="10" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="400" cy="1540" r="10" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="380" y1="1540" x2="400" y2="1540" stroke="#334155" stroke-width="2"/>

    <!-- Two Walking Pedestrians in Midground -->
    <circle cx="670" cy="1440" r="4" fill="#475569"/>
    <line x1="670" y1="1444" x2="670" y2="1460" stroke="#475569" stroke-width="2"/>

    <circle cx="685" cy="1442" r="4" fill="#475569"/>
    <line x1="685" y1="1446" x2="685" y2="1462" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- 10. High-Key Soft Lighting Mask for Readability -->
  <!-- Crisp top fade overlay to guarantee text and search bar pop in high contrast -->
  <linearGradient id="textReadabilityOverlay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
    <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
  </linearGradient>

  <rect width="1080" height="1920" fill="url(#textReadabilityOverlay)"/>
</svg>
