  .chart .bar.price { fill: #B4232A; }
  .chart .bar.risk { fill: #1E7A8C; }
  .chart .bar.neutral { fill: #5C6B72; }
  .chart .conn { stroke: #D2D9D8; stroke-width: 2; }
  .chart .lo { fill: #1E7A8C; }
  .chart .hi { fill: #B4232A; }
  .chart .risk-t { fill: #1E7A8C; font-weight: 600; letter-spacing: .06em; }
  .chart .price-t { fill: #B4232A; font-weight: 600; letter-spacing: .06em; }
