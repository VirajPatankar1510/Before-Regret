<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 194" width="620" height="194" class="chart" role="img"><style>
  .chart { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .chart text { fill: #1a1a1a; font-size: 13px; }
  .chart .lab { text-anchor: end; fill: #6b6b6b; }
